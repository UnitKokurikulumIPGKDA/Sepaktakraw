<div id="setupModal" style="display:none;" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[999]">
    <div class="academic-card p-8 w-full max-w-md">
        <h2 class="font-serif-title text-xl font-bold mb-4">Sistem Konfigurasi Master</h2>
        <p class="text-sm text-gray-600 mb-4">Masukkan URL Google Sheet baru dan ID Folder Drive untuk memulakan sistem.</p>
        
        <label class="dim-label">Google Sheet URL</label>
        <input type="text" id="ssUrl" placeholder="https://docs.google.com/spreadsheets/d/..." class="w-full mb-4">
        
        <label class="dim-label">Google Drive Folder ID (Untuk Gambar)</label>
        <input type="text" id="folderId" placeholder="1BiYC-1CuGn1c_4..." class="w-full mb-4">
        
        <button onclick="runMasterSetup()" id="setupBtn" class="btn-primary w-full py-3 rounded-lg">
            Hubungkan & Jana Header
        </button>
        <button onclick="document.getElementById('setupModal').style.display='none'" class="w-full mt-2 text-xs text-gray-400">Batal</button>
    </div>
</div>
